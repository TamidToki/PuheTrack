name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake declared in app/build.gradle.kts
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # Release signing is only configured when PUHE_* secrets are present,
      # so CI never builds a signed release. It runs unit tests, lint and a debug build.
      - name: Unit tests, lint, debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
